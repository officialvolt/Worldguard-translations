# WorldGuardTranslations 1.0.6
# WorldGuard remains responsible for protection/cancellation.
# This plugin only controls the player-facing replacement message.
#
# Supported output types:
#   CHAT
#   ACTION_BAR
#   TITLE
#
# TITLE additionally uses:
#   title:
#   subtitle:
#   fade-in:
#   stay:
#   fade-out:
#
# All message strings use MiniMessage, so hex colors such as <#ff5400>
# and tags such as <bold> are supported.

cooldown-seconds: 2

worldguard:
  # Suppress WorldGuard's global deny-message so the replacement message
  # from this plugin is not shown twice.
  suppress-default-deny-message: true

messages:
  # WorldGuard protection flags / player-facing denial categories.
  block-break:
    enabled: false
    type: ACTION_BAR
    message: "<#ff5400><bold>✕ Hey!</bold></#ff5400> <white>Sorry, but you cannot break blocks here!</white>"
    cooldown-seconds: 2

  block-place:
    enabled: true
    type: ACTION_BAR
    message: "<#ff5400><bold>✕ Hey!</bold></#ff5400> <white>Sorry, but you cannot place blocks here!</white>"
    cooldown-seconds: 2

  interact:
